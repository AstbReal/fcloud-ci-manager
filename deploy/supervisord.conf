; ============================================================================
; fcloud-ci-hub 程序定义（§11.2）
; 由 /etc/supervisor/supervisord.conf 的 [include] 引入
;
; 启动顺序由 priority 决定：
;   [20] postgresql  [21] redis  [30] nginx  [40] java app
; ============================================================================

; ---------- PostgreSQL 16 ----------
; 只听 127.0.0.1:5432（§11.2）
; 用官方 docker-entrypoint.sh 启动：空目录自动 initdb 并建库建用户，
; 已有 PG_VERSION 时直接启动（幂等，§11.2）。
[program:postgresql]
command=/usr/local/bin/docker-entrypoint.sh postgres -D /data/config-hub/pg -c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=/var/run/postgresql
user=postgres
priority=20
autostart=true
autorestart=true
startsecs=8
stopsignal=INT
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.err.log
environment=PGDATA="/data/config-hub/pg",POSTGRES_DB="fcloud_ci_hub",POSTGRES_USER="fcloud",POSTGRES_PASSWORD="fcloud",TZ="Asia/Shanghai"

; ---------- Redis 7 ----------
; 只听 127.0.0.1:6379，appendonly no（纯缓存，§11.2）
[program:redis]
command=/usr/local/bin/redis-server --bind 127.0.0.1 --port 6379 --appendonly no --save "" --daemonize no
priority=21
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

; ---------- nginx ----------
; :8080 对外唯一端口
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

; ---------- Spring Boot ----------
[program:app]
command=/usr/lib/jvm/java-17-openjdk/bin/java -XX:MaxRAMPercentage=70 -jar /app/app.jar
priority=40
autostart=true
autorestart=true
startsecs=15
startretries=10
stdout_logfile=/var/log/supervisor/app.log
stderr_logfile=/var/log/supervisor/app.err.log
environment=JAVA_HOME="/usr/lib/jvm/java-17-openjdk",TZ="Asia/Shanghai"
