# ============================================================================
# nginx 主配置（Alpine）
# 实际的 server 块由 entrypoint 用 envsubst 渲染到 /etc/nginx/conf.d/fcloud.conf
#
# 日志一律写 /dev/stdout、/dev/stderr：容器内写 /var/log/nginx/*.log 会让
# `docker logs` 看不到任何访问日志，而且日志会堆在可写层里撑大容器。
# 轮转与保留交给 docker 的 json-file driver（compose 已配 20m × 3）。
# ============================================================================
user root;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
