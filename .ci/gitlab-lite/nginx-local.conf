# ============================================================================
# 本地 OAuth 联调专用 nginx 配置
#
# 核心：把 gitlab-lite 反代到主程序同域（localhost:8080）下的 /gitlab 前缀，
# 让浏览器始终只访问一个 origin，从而 SameSite=Lax 的 cookie 能正常工作。
#
# 对比：之前 gitlab-lite 用独立端口 8929，与主程序 8080 是不同 origin，
# OAuth 回调后前端 XHR 因 Chrome 的 site-for-cookies 机制不带 cookie。
# ============================================================================
upstream fcloud_app {
    server 127.0.0.1:8081;
}

# gitlab-lite 通过 --network host 监听 8929（宿主机回环）
upstream gitlab_lite {
    server 127.0.0.1:8929;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    root /app/static;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 主程序 API ----
    location /api/ {
        proxy_pass http://fcloud_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ---- OAuth 入口 ----
    location /oauth2/ {
        proxy_pass http://fcloud_app;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /login/ {
        proxy_pass http://fcloud_app;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /oauth/ {
        proxy_pass http://fcloud_app;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- gitlab-lite 反代到同域 /gitlab 前缀 ----
    location /gitlab/ {
        proxy_pass http://gitlab_lite/;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ---- 健康检查 ----
    location /actuator/ {
        proxy_pass http://fcloud_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
