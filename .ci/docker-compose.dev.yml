# 本地开发依赖：PostgreSQL 16（§11.5）
# 用法：docker compose -f .ci/docker-compose.dev.yml up -d
#
# 注意：Redis 已从技术栈移除（改用进程内缓存，见 README 决策 D26），
# 这里不再提供 redis 服务；已有的 fcloud-dev-redis 容器可以删掉。
services:
  postgres:
    image: postgres:16-alpine
    container_name: fcloud-dev-pg
    environment:
      POSTGRES_DB: fcloud_ci_hub
      POSTGRES_USER: fcloud
      POSTGRES_PASSWORD: fcloud
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - fcloud-dev-pg:/var/lib/postgresql/data
    # 本地联调常驻：WSL 休眠后唤醒时自动恢复，避免 exit 255 后手动 start
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcloud -d fcloud_ci_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fcloud-dev-pg:
