# ============================================================================
# fcloud-ci-hub 单镜像部署（PG + nginx + JVM 全部在一个容器里）
#
# 前置：
#   1) 先构建镜像（见 .ci/build.sh）
#        bash .ci/build.sh base
#        bash .ci/build.sh
#   2) 准备环境变量
#        cp .ci/.env.example .ci/.env && vi .ci/.env
#   3) 启动（env_file 相对本文件所在目录，所以 -f 指到 .ci 即可）
#        docker compose -f .ci/docker-compose.yml up -d
#
# 数据在命名卷 fcloud-data 里（PG 数据、文件、备份、master.key）。
# ⚠️ `docker compose -f .ci/docker-compose.yml down -v` 会连卷一起删，
#    等于清库；只想停服务用 `down` 或 `stop`。
# ============================================================================
name: fcloud-ci-hub

services:
  hub:
    image: ${FCLOUD_IMAGE:-fcloud-ci-hub:latest}
    container_name: fcloud-ci-hub
    restart: unless-stopped
    # tini 作为 PID 1，负责转发信号和回收僵尸进程；
    # 业务进程由镜像内的 /app/supervise.sh 管理（PG → nginx → app）。
    init: true
    env_file:
      - .env
    environment:
      # 容器 OS 层固定 UTC（镜像不装 tzdata），JVM 内部用 Asia/Shanghai 展示
      TZ: UTC
    ports:
      - "${FCLOUD_HTTP_PORT:-8080}:8080"
    volumes:
      - fcloud-data:/data/config-hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # PG 用 INT 做 fast shutdown，留足退出时间，别让 docker 直接 SIGKILL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  fcloud-data:
    name: fcloud-data
